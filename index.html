<!DOCTYPE html>
<html>
<head>
    <title>Pizza Game World</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Pizza Game World</h1>
    <div id="game">
        <button onclick="rollDice()">Roll Dice</button>
        <p id="status">Status: Ready</p>
    </div>
    <script>
        const socket = io();
        socket.emit('join-room', 'room1');
        function rollDice() {
            let val = Math.floor(Math.random() * 6) + 1;
            socket.emit('roll', {roomId: 'room1', value: val});
        }
        socket.on('opponent-rolled', (val) => {
            document.getElementById('status').innerText = "Opponent rolled: " + val;
        });
    </script>
</body>
</html>
